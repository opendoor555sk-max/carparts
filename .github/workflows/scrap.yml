name: Scrap Bhav APK

on:
  push:
    branches: [scrap-rate]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test + build APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |FAILED|AssertionError" build.log | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ScrapBhav.apk
          ls -l ScrapBhav.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScrapBhav
          path: ScrapBhav.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scrap-v1.0.${{ github.run_number }}
          name: Scrap Bhav 1.0.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: ScrapBhav.apk
          make_latest: false

      - name: Write version file
        run: echo "${{ github.run_number }}" > version.txt

      - name: Update rolling OTA release (scrap-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scrap-latest
          name: Scrap Bhav (latest - OTA)
          body: "OTA helper for Scrap Bhav. Latest build: 1.0.${{ github.run_number }}"
          files: |
            version.txt
            ScrapBhav.apk
          make_latest: false
