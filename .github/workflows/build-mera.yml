name: Build Mera Hisab APK

on:
  push:
    branches: [mera-hisab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write repo name for in-app update check
        run: |
          mkdir -p android/app/src/main/assets
          printf '%s' "${{ github.repository }}" > android/app/src/main/assets/repo.txt

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "error:|^e: |FAILED" build.log | head -20 | while read -r l; do echo "::error::$l"; done
            echo "::error::DETAIL $(grep -E "error:|Could not|What went wrong|Unresolved|Exception" -A3 build.log | head -60 | tr '\n' '|' | cut -c1-6000)"
            exit 1; }

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Mera-Hisab.apk
          ls -l Mera-Hisab.apk
          echo "${{ github.run_number }}" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Mera-Hisab
          path: Mera-Hisab.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mera-v1.0.${{ github.run_number }}
          name: Mera Hisab 1.0.${{ github.run_number }}
          body: "Mera Hisab APK. Download Mera-Hisab.apk and install."
          files: Mera-Hisab.apk
          make_latest: false

      - name: Update rolling release (mera-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mera-latest
          name: Mera Hisab (latest)
          body: "Latest build: 1.0.${{ github.run_number }}"
          files: |
            version.txt
            Mera-Hisab.apk
          make_latest: false
