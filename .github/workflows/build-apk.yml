name: Build APK

on:
  push:
    branches: [kotlin-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not|Unresolved|> " build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "KabadiMarket-v2.0.${{ github.run_number }}.apk"
          ls -la *.apk
          echo "::notice::APK size: $(du -h KabadiMarket-*.apk | cut -f1)"

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Kabadi Market v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            New Kotlin app — phone par download karke install karo.
            (Open this page on your phone → tap the .apk file below.)
          files: KabadiMarket-v2.0.${{ github.run_number }}.apk
