name: Build APK

on:
  push:
    branches: [nirmaan-calc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test + build APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          wc -l build.log
          { grep -aE -A2 "\.java:[0-9]+: error:" build.log; grep -aE "e: |FAILED|AssertionError|expected|No key|What went wrong|Exception" build.log; tail -n 25 build.log; } | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk NirmaanCalc.apk
          ls -l NirmaanCalc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NirmaanCalc
          path: NirmaanCalc.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calc-v1.0.${{ github.run_number }}
          name: Nirmaan Calc 1.0.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: NirmaanCalc.apk
          make_latest: false

      - name: Write version file
        run: echo "${{ github.run_number }}" > version.txt

      - name: Update rolling OTA release (calc-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calc-latest
          name: Nirmaan Calc (latest - OTA)
          body: "OTA helper for Nirmaan Calc. Latest build: 1.0.${{ github.run_number }}"
          files: |
            version.txt
            NirmaanCalc.apk
          make_latest: false
