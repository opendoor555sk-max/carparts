name: Build APK

on:
  push:
    branches: [kabadi-calc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test + build APK
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk KabadiCalc.apk
          ls -l KabadiCalc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KabadiCalc
          path: KabadiCalc.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kabadi-v1.0.${{ github.run_number }}
          name: Kabadi Market Hisab 1.0.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: KabadiCalc.apk
          make_latest: false

      - name: Write version file
        run: echo "${{ github.run_number }}" > version.txt

      - name: Update rolling OTA release (kabadi-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kabadi-latest
          name: Kabadi Market Hisab (latest - OTA)
          body: "OTA helper for Kabadi Market Hisab. Latest build: 1.0.${{ github.run_number }}"
          files: |
            version.txt
            KabadiCalc.apk
          make_latest: false
