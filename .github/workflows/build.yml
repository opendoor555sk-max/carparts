name: Build APK

on:
  push:
    branches: [nirmaan-calc]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test + build APK
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk NirmaanCalc.apk
          ls -l NirmaanCalc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NirmaanCalc
          path: NirmaanCalc.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: calc-v1.0.${{ github.run_number }}
          name: Nirmaan Calc 1.0.${{ github.run_number }}
          body: "Phone par NirmaanCalc.apk download karke install karein."
          files: NirmaanCalc.apk
          make_latest: false
